name: Build and deploy ASP.Net Core app to Azure Web App - cosmicstoreapi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build CosmicStoreAPI/CosmicStoreAPI.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish CosmicStoreAPI/CosmicStoreAPI.csproj -c Release -o "${{ github.workspace }}/artifacts/api"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/artifacts/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3147290218304B138D787DADE925A320 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E2E6A6DF6D9640539018A41B88B3D736 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_334DBE17B85049358B34A67A972A564F }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'cosmicstoreapi'
          slot-name: 'Production'
          package: .
