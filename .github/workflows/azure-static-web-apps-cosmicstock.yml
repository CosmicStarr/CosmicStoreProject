name: Deploy CosmicStock to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'CosmicStock/**'
      - '.github/workflows/azure-static-web-apps-cosmicstock.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'CosmicStock/**'
      - '.github/workflows/azure-static-web-apps-cosmicstock.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: CosmicStock/package-lock.json

      - name: Install and build Angular
        working-directory: CosmicStock
        run: |
          npm ci
          npm run build:prod

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_COSMICSTOCK }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: CosmicStock
          api_location: ''
          output_location: dist/CosmicStock/browser
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Static Web Apps PR environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_COSMICSTOCK }}
          action: close
