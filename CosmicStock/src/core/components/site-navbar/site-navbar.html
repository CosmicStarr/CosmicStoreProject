@if (visible()) {
  <div class="top-bar">
    <div class="top-bar-left">
      <a routerLink="/">Help</a>
      <span class="separator">|</span>
      <a routerLink="/">Support</a>
      <span class="separator">|</span>
      <a routerLink="/">Contact</a>
    </div>

    @if (userService.currentUser$ | async; as user) {
      <div class="top-bar-right" [class.mobile-open]="isMobileMenuOpen">
        <div class="dropdown-container" (click)="toggleDropdown('dashboard')">
          <div class="dropdown-toggle">My Dashboard</div>
          <div class="dropdown-menu dashboard-menu" [class.show]="activeDropdown === 'dashboard'">
            <div class="dropdown-header-mobile">
              <span>My Account</span>
              <button type="button" class="close-btn" (click)="closeDropdowns($event)">&times;</button>
            </div>
            <a routerLink="/orders" (click)="closeDropdowns($event)">My Orders</a>
            <a routerLink="/account/wishlist" (click)="closeDropdowns($event)">Wishlist</a>
            <a routerLink="/account/profile" (click)="closeDropdowns($event)">Profile</a>
            @if (isAdmin()) {
              <a routerLink="/admin/dashboard" (click)="closeDropdowns($event)">Admin</a>
            }
            <button type="button" class="logout-link" (click)="logout()">Sign Out</button>
          </div>
        </div>
      </div>
    } @else {
      <div class="right-Side">
        <a routerLink="/login" class="auth-link">Login</a>
        <span class="separator desktop-only">|</span>
        <a routerLink="/register" class="auth-link">Register</a>
      </div>
    }
  </div>

  <header class="main-header">
    <a routerLink="/" class="logo" aria-label="CosmicStore home">
      <span class="logo-icon" aria-hidden="true">🛍️</span>
      <span class="logo-text">Electro</span>
    </a>

    <div class="search-container">
      <label for="global-search" class="visually-hidden">Search products</label>
      <input id="global-search" type="search" placeholder="Search Looking For?" class="search-input">
    </div>

    <nav class="header-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/store" routerLinkActive="active">Shop</a>
      <a routerLink="/orders" routerLinkActive="active">Orders</a>
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="cart-icon-btn"
        (click)="cartService.togglePanel()"
        [attr.aria-expanded]="cartService.panelOpen()"
        aria-controls="cart-side-panel"
        aria-label="Open shopping cart">
        <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2zM7.16 14h9.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 21.05 5H5.21L4.27 2H1v2h2l3.6 7.59-1.35 2.44C4.52 15.37 5.48 17 7 17h12v-2H7.16l1.1-1z"/>
        </svg>
        @if (cartService.itemCount() > 0) {
          <span class="cart-badge" aria-hidden="true">{{ cartService.itemCount() }}</span>
        }
      </button>
    </div>
  </header>

  <nav class="category-nav" aria-label="Categories">
    <a routerLink="/store" class="all-categories-btn">
      <span class="hamburger" aria-hidden="true">☰</span> All Categories
    </a>
  </nav>
}
