<header class="page-header">
  <div>
    <h1>CJ Product Catalog</h1>
    <p class="subtitle">Publish products from CJ staging to your storefront</p>
  </div>
  <div class="header-actions">
    <button type="button" class="secondary-btn" (click)="publishAll()" [disabled]="publishing || !apiData().length">
      {{ publishing ? 'Publishing...' : 'Publish All on Page' }}
    </button>
  </div>
</header>

@if (message) {
  <p class="status-message" [class.error]="isError">{{ message }}</p>
}

<div class="product-grid">
  @for (product of apiData(); track product.id) {
    <div class="product-card">
      <div class="card-image-wrapper">
        <img [src]="product.bigImage" [alt]="product.nameEn" class="product-thumbnail">
      </div>

      <div class="card-content">
        <div class="card-header">
          <span class="category-badge">{{ product.category?.categoryName }}</span>
          <span class="sku">SKU: {{ product.sku }}</span>
        </div>

        <h3 class="product-title">{{ product.nameEn }}</h3>
        <p class="product-price">${{ product.sellPrice }}</p>
      </div>

      <div class="card-footer">
        <button type="button" class="publish-btn" (click)="publishOne(product.id)" [disabled]="publishing">
          Publish to Store
        </button>
        <a routerLink="/admin/edit-Product/{{ product.id }}" class="action-btn">Edit Details</a>
      </div>
    </div>
  }
</div>
