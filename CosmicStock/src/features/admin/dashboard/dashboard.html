<div class="admin-layout">
  <!-- Sidebar Navigation -->
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>Cosmic Admin</h2>
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/admin/dashboard" class="active">Products</a>
      <a routerLink="/admin/orders">Orders</a>
      <a routerLink="/admin/users">Users</a>
      <a routerLink="/admin/settings">Settings</a>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="admin-main">
    <header class="page-header">
      <h1>Product Catalog</h1>
      <button class="add-btn">+ Add Product</button>
    </header>

    <!-- Product Grid -->
    <div class="product-grid">
      @for (product of apiData(); track product.sku) {
        <div class="product-card">
          <div class="card-image-wrapper">
            <img [src]="product.bigImage" [alt]="product.nameEn" class="product-thumbnail">
          </div>
          
          <div class="card-content">
            <div class="card-header">
              <span class="category-badge">{{product.category.categoryName}}</span>
              <span class="sku">SKU: {{product.sku}}</span>
            </div>
            
            <h3 class="product-title">{{product.nameEn}}</h3>
            <p class="product-price">${{product.sellPrice}}</p>
          </div>

          <div class="card-footer">
            <a routerLink="/admin/edit-Product/{{product.id}}" class="action-btn">Edit Details</a>
          </div>
        </div>
      }
    </div>
  </main>
</div>
