<header class="page-header">
  <h1>Users</h1>
</header>

@if (message()) {
  <p class="action-message" role="status">{{ message() }}</p>
}

<div class="table-wrap" [attr.aria-busy]="loading()">
  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Username</th>
        <th>User ID</th>
      </tr>
    </thead>
    <tbody>
      @if (!users().length) {
        <tr>
          <td colspan="3" class="empty-cell">
            {{ loading() ? 'Loading users...' : 'No users yet.' }}
          </td>
        </tr>
      } @else {
        @for (user of users(); track user.id) {
          <tr>
            <td>{{ user.email }}</td>
            <td>{{ user.userName }}</td>
            <td class="muted">{{ user.id }}</td>
          </tr>
        }
      }
    </tbody>
  </table>
</div>
