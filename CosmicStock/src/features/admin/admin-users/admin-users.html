<header class="page-header">
  <h1>Users</h1>
</header>

@if (loading) {
  <p class="muted">Loading users...</p>
} @else {
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Username</th>
          <th>User ID</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user.id) {
          <tr>
            <td>{{ user.email }}</td>
            <td>{{ user.userName }}</td>
            <td class="muted">{{ user.id }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
}
