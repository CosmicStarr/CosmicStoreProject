<div class="login-wrapper">
  <div class="login-container">
    <div class="login-header">
      <app-brand-logo [compact]="true" />
      <h2>Welcome Back</h2>
      <p>Sign in to your CosmicStore account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Enter your password">
      </div>

      @if (error) {
        <div class="error-container">
          <p class="error-text">⚠ {{ error }}</p>
        </div>
      }

      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid">
        Log In
      </button>

    </form>

    <div class="form-footer">
      <a routerLink="/account/forgot-password">Forgot password?</a>
    </div>

    <div class="form-footer">
      Don't have an account? <a routerLink="/register">Register here</a>
    </div>
    <div class="form-footer">
      Or <a routerLink="/store">continue shopping as a guest</a>
    </div>
  </div>
</div>
