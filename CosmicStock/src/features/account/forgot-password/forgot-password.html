<div class="account-wrapper">
  <div class="account-container">
    <h2>Forgot Password</h2>
    <p class="muted">Enter your email and we will send you a reset link.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com">
      </div>

      @if (message) {
        <p [class.error-text]="isError" role="status">{{ message }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="form.invalid || submitted">
        {{ submitted ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <div class="form-footer">
      <a routerLink="/login">Back to Login</a>
    </div>
  </div>
</div>
