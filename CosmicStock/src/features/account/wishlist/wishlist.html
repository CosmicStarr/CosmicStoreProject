<div class="wishlist-page">
  <header class="page-header">
    <h1>My Wishlist</h1>
  </header>

  @if (loading) {
    <p class="muted">Loading wishlist...</p>
  } @else if (!items().length) {
    <p class="muted">Your wishlist is empty.</p>
    <a routerLink="/store" class="link-btn">Browse Products</a>
  } @else {
    <div class="wishlist-grid">
      @for (item of items(); track item.id) {
        <article class="wishlist-card">
          <a [routerLink]="['/store', item.productId]" class="image-link">
            <img [src]="item.bigImage" [alt]="item.nameEn">
          </a>
          <div class="card-body">
            <h2><a [routerLink]="['/store', item.productId]">{{ item.nameEn }}</a></h2>
            <p class="sku">SKU: {{ item.sku }}</p>
            <p class="price">{{ item.sellPrice | currency:'USD':'symbol' }}</p>
            <button type="button" class="danger-btn" (click)="removeItem(item.productId)">Remove</button>
          </div>
        </article>
      }
    </div>
  }
</div>
