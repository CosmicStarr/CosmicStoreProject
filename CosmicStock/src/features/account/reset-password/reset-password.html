<div class="account-wrapper">
  <div class="account-container">
    <h2>Reset Password</h2>
    <p class="muted">Choose a new password for your account.</p>

    @if (!email || !token) {
      <p class="error-text">Invalid reset link.</p>
      <a routerLink="/account/forgot-password" class="link-btn">Request a new link</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input id="newPassword" type="password" formControlName="newPassword">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" type="password" formControlName="confirmPassword">
        </div>

        @if (message) {
          <p [class.error-text]="isError" role="status">{{ message }}</p>
        }

        <button type="submit" class="submit-btn" [disabled]="form.invalid || submitting">
          {{ submitting ? 'Updating...' : 'Update Password' }}
        </button>
      </form>
    }
  </div>
</div>
