<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your CosmicStore order</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f6f8; padding: 40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden;">
                    <tr>
                        <td align="center" style="background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); padding: 36px 20px;">
                            <h1 style="color: #ffffff; font-size: 24px; font-weight: 700; margin: 0;">CosmicStore</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 32px;">
                            <h2 style="color: #1e293b; font-size: 20px; font-weight: 600; margin-top: 0; margin-bottom: 16px;">Thanks for your order, {{NAME}}</h2>
                            <p style="color: #475569; font-size: 16px; line-height: 24px; margin-top: 0; margin-bottom: 16px;">
                                We received your order <strong>{{ORDER_ID}}</strong>. A confirmation was sent to {{EMAIL}}.
                            </p>
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 24px;">
                                {{ITEMS}}
                                <tr>
                                    <td style="padding: 8px 0; color: #64748b;">Shipping</td>
                                    <td style="padding: 8px 0; text-align: right; color: #64748b;">{{SHIPPING}}</td>
                                </tr>
                                <tr>
                                    <td style="padding: 12px 0 0; font-weight: 700; color: #1e293b;">Total</td>
                                    <td style="padding: 12px 0 0; text-align: right; font-weight: 700; color: #1e293b;">{{TOTAL}}</td>
                                </tr>
                            </table>
                            <p style="color: #475569; font-size: 15px; line-height: 22px; margin: 0;">
                                Ships to:<br>
                                {{ADDRESS}}
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color: #f8fafc; padding: 20px 32px; text-align: center; border-top: 1px solid #f1f5f9;">
                            <p style="color: #94a3b8; font-size: 12px; margin: 0;">
                                &copy; 2026 CosmicStore. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
