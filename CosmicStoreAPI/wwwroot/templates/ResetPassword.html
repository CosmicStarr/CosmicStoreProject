<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f6f8; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f4f6f8; padding: 40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06); overflow: hidden;">
                    <tr>
                        <td align="center" style="background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); padding: 36px 20px;">
                            <h1 style="color: #ffffff; font-size: 24px; font-weight: 700; margin: 0;">CosmicStore</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 32px; text-align: left;">
                            <h2 style="color: #1e293b; font-size: 20px; font-weight: 600; margin-top: 0; margin-bottom: 16px;">Reset your password</h2>
                            <p style="color: #475569; font-size: 16px; line-height: 24px; margin-top: 0; margin-bottom: 24px;">
                                We received a request to reset your password. Click the button below to create a new one.
                            </p>
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 32px;">
                                <tr>
                                    <td align="center">
                                        <a href="{{URL}}" target="_blank" style="background-color: #2563eb; border-radius: 6px; color: #ffffff; display: inline-block; font-size: 16px; font-weight: 600; line-height: 50px; text-align: center; text-decoration: none; width: 220px;">Reset Password</a>
                                    </td>
                                </tr>
                            </table>
                            <p style="color: #64748b; font-size: 14px; line-height: 20px; margin: 0;">
                                This link expires in <strong>3 hours</strong>. If you did not request a reset, you can ignore this email.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
